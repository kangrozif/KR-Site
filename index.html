<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KR Trade — Sedang Pemeliharaan</title>
<meta name="description" content="KR Trade sedang dalam pemeliharaan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#0E1626;
    --navy-800:#16213A;
    --gold-500:#C9A227;
    --gold-300:#E4C766;
    --ivory:#F3EFE4;
    --slate:#8892A6;
    --rule:rgba(243,239,228,0.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--navy-900);
    color:var(--ivory);
    font-family:'Inter',sans-serif;
    line-height:1.6;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;text-decoration:none;}
  .mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em;}

  header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    padding:20px 6vw;
    background:rgba(14,22,38,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--rule);
  }
  .wordmark{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
    letter-spacing:0.02em;
  }
  .wordmark span{color:var(--gold-500);}

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8vw 6vw;
  }
  .maintenance{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .eyebrow{
    font-size:0.78rem;
    color:var(--gold-500);
    text-transform:uppercase;
    letter-spacing:0.12em;
    display:flex;align-items:center;gap:10px;
  }
  .eyebrow::before,
  .eyebrow::after{
    content:'';
    width:22px;height:1px;
    background:var(--gold-500);
    display:inline-block;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(1.8rem, 5vw, 3rem);
    line-height:1.15;
    max-width:20ch;
  }
  h1 em{color:var(--gold-500);font-style:normal;}
  p.sub{
    color:var(--slate);
    font-size:0.95rem;
    max-width:40ch;
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">KR <span>TRADE</span></div>
</header>

<main>
  <div class="maintenance">
    <div class="eyebrow mono">Sedang Pemeliharaan</div>
    <h1>Under maintenance <em>by kangrozif</em></h1>
    <p class="sub">Situs sedang dalam proses pembaruan. Silakan kembali beberapa saat lagi.</p>
  </div>
</main>

</body>
</html>
