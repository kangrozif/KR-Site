<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

// Ganti dengan Web App URL hasil deploy Apps Script (admin-appscript/Code.gs)
const API_URL = 'https://script.google.com/macros/s/AKfycbwasc_tlV4zllzv0cUnhK7HU7Mp6L-c-DAIez5TOG7_zDaVRRvdmnVHw5qqXrBPL0xScg/exec';

const TOKEN_KEY = 'dpt_admin_token';
const ROLE_KEY = 'dpt_admin_role';
const EXPIRES_KEY = 'dpt_admin_expires';

/**
 * Ambil data dari Apps Script lewat JSONP (bukan fetch), supaya tidak kena kebijakan CORS browser —
 * tag <script> yang dipakai JSONP tidak tunduk pada aturan CORS, berbeda dengan fetch()/XHR.
 * Server (Code.gs) membungkus respons dengan nama fungsi callback ini saat parameter callback dikirim.
 */
let jsonpCounter = 0;
function jsonpRequest(url, timeoutMs) {
  return new Promise((resolve, reject) => {
    const callbackName = 'dpt_jsonp_cb_' + (jsonpCounter++) + '_' + Date.now();
    const script = document.createElement('script');
    let finished = false;
    let timer;

    const cleanup = () => {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timer);
    };

    window[callbackName] = (data) => {
      if (finished) return;
      finished = true;
      cleanup();
      resolve(data);
    };

    script.onerror = () => {
      if (finished) return;
      finished = true;
      cleanup();
      reject(new Error('Gagal menghubungi server (JSONP gagal dimuat). Cek koneksi internet.'));
    };

    const sep = url.includes('?') ? '&' : '?';
    script.src = url + sep + 'callback=' + callbackName;
    document.head.appendChild(script);

    timer = setTimeout(() => {
      if (finished) return;
      finished = true;
      cleanup();
      reject(new Error('Request timeout — server tidak merespons dalam waktu yang wajar.'));
    }, timeoutMs || 20000);
  });
}

function LoginScreen({ onSuccess }) {
  const [tab, setTab] = useState('superadmin'); // 'superadmin' | 'admin'
  const [password, setPassword] = useState('');
  const [code, setCode] = useState('');
  const [checking, setChecking] = useState(false);
  const [error, setError] = useState('');

  const submitSuperadmin = (e) => {
    e.preventDefault();
    if (!password.trim()) return;
    setChecking(true);
    setError('');
    jsonpRequest(API_URL + '?action=meta&token=' + encodeURIComponent(password.trim()))
      .then(data => {
        if (data.unauthorized) { setError('Password salah.'); return; }
        if (data.error) { setError(data.error); return; }
        onSuccess({ token: password.trim(), role: 'superadmin', expiresAt: null });
      })
      .catch(err => setError('Gagal menghubungi server: ' + (err && err.message ? err.message : String(err))))
      .finally(() => setChecking(false));
  };

  const submitAdminCode = (e) => {
    e.preventDefault();
    if (!code.trim()) return;
    setChecking(true);
    setError('');
    jsonpRequest(API_URL + '?action=logincode&code=' + encodeURIComponent(code.trim()))
      .then(data => {
        if (data.error) { setError(data.error); return; }
        onSuccess({ token: data.sessionToken, role: 'admin', expiresAt: data.expiresAt });
      })
      .catch(err => setError('Gagal menghubungi server: ' + (err && err.message ? err.message : String(err))))
      .finally(() => setChecking(false));
  };

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-icon">🔒</div>
        <div className="login-title">Akses Admin</div>
        <div className="login-sub">Data Pemilih — kangrozif.my.id</div>

        <div className="login-tabs">
          <button type="button" className={'login-tab' + (tab === 'superadmin' ? ' active' : '')} onClick={() => { setTab('superadmin'); setError(''); }}>
            Superadmin
          </button>
          <button type="button" className={'login-tab' + (tab === 'admin' ? ' active' : '')} onClick={() => { setTab('admin'); setError(''); }}>
            Admin (Kode dari Superadmin)
          </button>
        </div>

        {tab === 'superadmin' ? (
          <form onSubmit={submitSuperadmin}>
            <input
              className="input"
              type="password"
              placeholder="Password Superadmin"
              value={password}
              onChange={e => setPassword(e.target.value)}
              autoFocus
            />
            {error && <div className="login-error">⚠️ {error}</div>}
            <button className="login-btn" type="submit" disabled={checking}>
              {checking ? 'Memeriksa...' : 'Masuk sebagai Superadmin'}
            </button>
          </form>
        ) : (
          <form onSubmit={submitAdminCode}>
            <input
              className="input mono"
              type="text"
              inputMode="numeric"
              maxLength={6}
              placeholder="Kode 6 digit dari Superadmin"
              value={code}
              onChange={e => setCode(e.target.value.replace(/[^0-9]/g, ''))}
              autoFocus
            />
            {error && <div className="login-error">⚠️ {error}</div>}
            <button className="login-btn" type="submit" disabled={checking}>
              {checking ? 'Memeriksa...' : 'Masuk sebagai Admin'}
            </button>
            <div style={{ fontSize: '11px', color: 'var(--text-faint)', marginTop: '10px' }}>
              Hubungi Superadmin (WA/telepon) untuk minta kode akses. Ketik kode yang diberikan secepatnya — kode hanya berlaku sekitar 2-3 menit. Sesi login otomatis berakhir 1 jam setelah masuk.
            </div>
          </form>
        )}
      </div>
    </div>
  );
}

function TotpSetupPanel({ token }) {
  const [secret, setSecret] = useState('');
  const [otpauthUri, setOtpauthUri] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [revealed, setRevealed] = useState(false);

  const fetchTotp = (regenerate) => {
    if (regenerate) {
      const ok = window.confirm('Reset akan membuat QR/kode lama tidak berlaku lagi — Anda perlu scan ulang QR baru ke Google Authenticator di HP Anda. Lanjutkan?');
      if (!ok) return;
    }
    setLoading(true);
    setError('');
    jsonpRequest(API_URL + '?action=setuptotp&token=' + encodeURIComponent(token) + (regenerate ? '&regenerate=true' : ''))
      .then(data => {
        if (data.error) { setError(data.error); return; }
        setSecret(data.secret);
        setOtpauthUri(data.otpauthUri);
        setRevealed(true);
      })
      .catch(err => setError('Gagal memuat setup: ' + (err && err.message ? err.message : String(err))))
      .finally(() => setLoading(false));
  };

  const qrUrl = otpauthUri
    ? 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(otpauthUri)
    : '';

  return (
    <div className="panel">
      <div className="panel-title">🔐 Google Authenticator Superadmin <span className="badge" style={{ color: 'var(--danger)' }}>RAHASIA</span></div>
      <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '10px' }}>
        <b style={{ color: 'var(--danger)' }}>QR ini HANYA untuk di-scan ke HP Superadmin sendiri — JANGAN dibagikan ke admin biasa.</b>
        {' '}Kalau admin biasa punya akses ke QR ini, mereka bisa generate kode sendiri kapan pun, dan tujuan sistem ini (Superadmin harus terlibat di setiap login) jadi hilang.
        <br/><br/>
        Cara pakai: saat admin biasa menghubungi Anda minta akses, buka aplikasi Google Authenticator di HP Anda, baca kode 6-digit yang sedang tampil, lalu kirimkan manual (WhatsApp/telepon) ke admin biasa tersebut. Kode berlaku sekitar 2-3 menit sejak Anda membacanya.
      </div>

      {error && <div className="login-error" style={{ marginBottom: '10px' }}>⚠️ {error}</div>}

      {!revealed ? (
        <button className="code-gen-btn" onClick={() => fetchTotp(false)} disabled={loading}>
          {loading ? 'Memuat...' : '👁 Tampilkan QR Setup (untuk HP Anda sendiri)'}
        </button>
      ) : (
        <React.Fragment>
          <div className="code-panel" style={{ textAlign: 'center' }}>
            {qrUrl && <img src={qrUrl} alt="QR Google Authenticator" style={{ borderRadius: '8px', background: '#fff', padding: '8px' }} />}
            <div style={{ fontSize: '11px', color: 'var(--text-faint)', marginTop: '10px' }}>
              Atau masukkan manual (kalau tidak bisa scan) — Kunci Rahasia:
            </div>
            <div className="mono" style={{ fontSize: '14px', color: 'var(--gold)', letterSpacing: '0.05em', marginTop: '4px', wordBreak: 'break-all' }}>
              {secret}
            </div>
          </div>
          <div style={{ display: 'flex', gap: '8px', marginTop: '10px' }}>
            <button className="code-gen-btn" onClick={() => fetchTotp(false)} disabled={loading}>
              {loading ? 'Memuat...' : '↻ Muat Ulang'}
            </button>
            <button className="code-gen-btn" style={{ borderColor: 'var(--danger-dim)', color: 'var(--danger)' }} onClick={() => fetchTotp(true)} disabled={loading}>
              {loading ? '...' : '⚠ Reset (cabut semua akses lama)'}
            </button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function App() {
  const [session, setSession] = useState(() => {
    const token = sessionStorage.getItem(TOKEN_KEY);
    const role = sessionStorage.getItem(ROLE_KEY);
    const expiresAtRaw = sessionStorage.getItem(EXPIRES_KEY);
    const expiresAt = expiresAtRaw ? parseInt(expiresAtRaw, 10) : null;
    if (token && role) {
      if (expiresAt && expiresAt <= Date.now()) {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(ROLE_KEY);
        sessionStorage.removeItem(EXPIRES_KEY);
        return null;
      }
      return { token, role, expiresAt };
    }
    return null;
  });

  const [meta, setMeta] = useState({ kecamatan: {}, totalRecords: 0 });
  const [metaLoading, setMetaLoading] = useState(true);
  const [metaError, setMetaError] = useState('');

  const [namaQuery, setNamaQuery] = useState('');
  const [nikQuery, setNikQuery] = useState('');
  const [nkkQuery, setNkkQuery] = useState('');
  const [jkFilter, setJkFilter] = useState('SEMUA');
  const [umurMin, setUmurMin] = useState('');
  const [umurMax, setUmurMax] = useState('');
  const [selKec, setSelKec] = useState('SEMUA');
  const [selDesa, setSelDesa] = useState('SEMUA');

  const [results, setResults] = useState([]);
  const [needsNarrow, setNeedsNarrow] = useState(false);
  const [scanned, setScanned] = useState(0);
  const [searching, setSearching] = useState(false);
  const [searchError, setSearchError] = useState('');
  const [hasSearched, setHasSearched] = useState(false);

  const requestIdRef = useRef(0);
  const token = session ? session.token : '';

  const handleLogout = useCallback(() => {
    sessionStorage.removeItem(TOKEN_KEY);
    sessionStorage.removeItem(ROLE_KEY);
    sessionStorage.removeItem(EXPIRES_KEY);
    setSession(null);
  }, []);

  const handleLoginSuccess = ({ token, role, expiresAt }) => {
    sessionStorage.setItem(TOKEN_KEY, token);
    sessionStorage.setItem(ROLE_KEY, role);
    if (expiresAt) sessionStorage.setItem(EXPIRES_KEY, String(expiresAt));
    else sessionStorage.removeItem(EXPIRES_KEY);
    setSession({ token, role, expiresAt: expiresAt || null });
  };

  // Cegah klik kanan & shortcut devtools (penghalang ringan, bukan proteksi sungguhan)
  useEffect(() => {
    const blockContextMenu = (e) => e.preventDefault();
    const blockKeys = (e) => {
      if (!e.key) return; // beberapa keyboard virtual/IME mengirim event tanpa e.key
      const k = e.key.toLowerCase();
      if (e.key === 'F12') { e.preventDefault(); return false; }
      if ((e.ctrlKey || e.metaKey) && k === 'u') { e.preventDefault(); return false; }
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].includes(k)) { e.preventDefault(); return false; }
    };
    document.addEventListener('contextmenu', blockContextMenu);
    document.addEventListener('keydown', blockKeys);
    return () => {
      document.removeEventListener('contextmenu', blockContextMenu);
      document.removeEventListener('keydown', blockKeys);
    };
  }, []);

  // Auto-logout idle 20 menit (semua role)
  useEffect(() => {
    if (!token) return;
    let timer;
    const scheduleLogout = () => {
      clearTimeout(timer);
      timer = setTimeout(handleLogout, 20 * 60 * 1000);
    };
    const events = ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'];
    events.forEach(ev => window.addEventListener(ev, scheduleLogout));
    scheduleLogout();
    return () => {
      clearTimeout(timer);
      events.forEach(ev => window.removeEventListener(ev, scheduleLogout));
    };
  }, [token, handleLogout]);

  // Hard session limit 1 jam untuk Admin biasa (bukan idle-based, tidak bisa diperpanjang aktivitas)
  useEffect(() => {
    if (!session || !session.expiresAt) return;
    const msLeft = session.expiresAt - Date.now();
    if (msLeft <= 0) { handleLogout(); return; }
    const t = setTimeout(handleLogout, msLeft);
    return () => clearTimeout(t);
  }, [session, handleLogout]);

  useEffect(() => {
    if (!token) return;
    jsonpRequest(API_URL + '?action=meta&token=' + encodeURIComponent(token))
      .then(data => {
        if (data.unauthorized) { handleLogout(); return; }
        if (data.error) throw new Error(data.error);
        setMeta(data);
      })
      .catch(err => setMetaError(err.message || 'Gagal memuat data. Cek API_URL sudah diisi Web App URL yang benar.'))
      .finally(() => setMetaLoading(false));
  }, [token]);

  const kecamatanList = useMemo(() => Object.keys(meta.kecamatan || {}).sort(), [meta]);
  const desaList = useMemo(() => {
    if (selKec === 'SEMUA') return [];
    return (meta.kecamatan[selKec] || []).map(d => d.desa).sort();
  }, [meta, selKec]);
  const totalDesa = useMemo(
    () => Object.values(meta.kecamatan || {}).reduce((s, arr) => s + arr.length, 0),
    [meta]
  );

  const runSearch = useCallback(() => {
    setHasSearched(true);
    setSearchError('');
    setSearching(true);
    setNeedsNarrow(false);

    const myRequestId = ++requestIdRef.current;

    const url = API_URL + '?action=search'
      + '&token=' + encodeURIComponent(token)
      + '&nama=' + encodeURIComponent(namaQuery.trim())
      + '&nik=' + encodeURIComponent(nikQuery.trim())
      + '&nkk=' + encodeURIComponent(nkkQuery.trim())
      + '&jk=' + encodeURIComponent(jkFilter)
      + '&umurMin=' + encodeURIComponent(umurMin)
      + '&umurMax=' + encodeURIComponent(umurMax)
      + '&kec=' + encodeURIComponent(selKec)
      + '&desa=' + encodeURIComponent(selDesa);

    jsonpRequest(url, 55000)
      .then(data => {
        if (myRequestId !== requestIdRef.current) return; // respons usang, abaikan
        if (data.unauthorized) { handleLogout(); return; }
        if (data.error) throw new Error(data.error);
        if (data.needsNarrow) {
          setNeedsNarrow(true);
          setResults([]);
          setScanned(0);
        } else {
          setResults(data.results || []);
          setScanned(data.scanned || 0);
        }
      })
      .catch(err => {
        if (myRequestId !== requestIdRef.current) return;
        setSearchError(err.message || 'Gagal mengambil hasil pencarian.');
      })
      .finally(() => {
        if (myRequestId !== requestIdRef.current) return;
        setSearching(false);
      });
  }, [namaQuery, nikQuery, nkkQuery, jkFilter, umurMin, umurMax, selKec, selDesa, token, handleLogout]);

  // Semua pencarian (Nama, NIK, NKK, Kecamatan, Desa, Jenis Kelamin, Umur) sekarang murni manual —
  // hanya jalan saat klik tombol 🔎 atau tekan Enter, tidak ada lagi auto-search saat ganti dropdown.

  const handleFormSubmit = (e) => {
    e.preventDefault();
    runSearch();
  };

  const resetFilters = () => {
    setNamaQuery('');
    setNikQuery('');
    setNkkQuery('');
    setJkFilter('SEMUA');
    setUmurMin('');
    setUmurMax('');
    setSelKec('SEMUA');
    setSelDesa('SEMUA');
    setResults([]);
    setHasSearched(false);
    setNeedsNarrow(false);
    setSearchError('');
    setScanned(0);
  };

  if (!session) {
    return <LoginScreen onSuccess={handleLoginSuccess} />;
  }

  const isEmpty = !metaLoading && kecamatanList.length === 0 && !metaError;

  return (
    <React.Fragment>
      <div className="header">
        <div>
          <div className="header-eyebrow">
            Admin · Data Pemilih {session.role === 'superadmin' ? <span className="badge">SUPERADMIN</span> : <span className="badge">ADMIN</span>}
          </div>
          <h1 className="header-title">Filter &amp; Pencarian Data</h1>
          <div className="header-sub">Cari berdasarkan Nama, NIK, NKK, Jenis Kelamin, Umur, Kecamatan, dan Desa</div>
        </div>
        <div className="stat-row">
          <div className="stat-pill">👥 <b>{(meta.totalRecords || 0).toLocaleString('id-ID')}</b> data</div>
          <div className="stat-pill">📍 <b>{kecamatanList.length}</b> kec · <b>{totalDesa}</b> desa</div>
          <button onClick={handleLogout} className="stat-pill" style={{ cursor: 'pointer', border: 'none', color: 'var(--danger)' }}>
            🚪 Keluar
          </button>
        </div>
      </div>

      {session.role === 'superadmin' && <TotpSetupPanel token={token} />}

      <div className="panel">
        <form className="filter-grid" onSubmit={handleFormSubmit}>
          <input
            className="input"
            placeholder="Ketik nama untuk mencari..."
            value={namaQuery}
            onChange={e => setNamaQuery(e.target.value)}
            disabled={isEmpty}
          />
          <select
            className="select"
            value={selKec}
            onChange={e => { setSelKec(e.target.value); setSelDesa('SEMUA'); }}
            disabled={isEmpty}
          >
            <option value="SEMUA">Semua Kecamatan</option>
            {kecamatanList.map(k => <option key={k} value={k}>{k}</option>)}
          </select>
          <select
            className="select"
            value={selDesa}
            onChange={e => setSelDesa(e.target.value)}
            disabled={isEmpty || selKec === 'SEMUA'}
          >
            <option value="SEMUA">Semua Desa</option>
            {desaList.map(d => <option key={d} value={d}>{d}</option>)}
          </select>
          <button type="submit" className="search-btn" disabled={isEmpty || searching} title="Cari">
            🔎
          </button>

          <div className="filter-grid-2" style={{ gridColumn: '1 / -1' }}>
            <input
              className="input"
              placeholder="Cari NIK..."
              value={nikQuery}
              onChange={e => setNikQuery(e.target.value)}
              disabled={isEmpty}
              inputMode="numeric"
            />
            <input
              className="input"
              placeholder="Cari NKK..."
              value={nkkQuery}
              onChange={e => setNkkQuery(e.target.value)}
              disabled={isEmpty}
              inputMode="numeric"
            />
            <select
              className="select"
              value={jkFilter}
              onChange={e => setJkFilter(e.target.value)}
              disabled={isEmpty}
            >
              <option value="SEMUA">Semua JK</option>
              <option value="L">Laki-laki (L)</option>
              <option value="P">Perempuan (P)</option>
            </select>
            <div className="umur-row">
              <input
                className="input"
                placeholder="Min"
                value={umurMin}
                onChange={e => setUmurMin(e.target.value.replace(/[^0-9]/g, ''))}
                disabled={isEmpty}
                inputMode="numeric"
              />
              <span>—</span>
              <input
                className="input"
                placeholder="Max"
                value={umurMax}
                onChange={e => setUmurMax(e.target.value.replace(/[^0-9]/g, ''))}
                disabled={isEmpty}
                inputMode="numeric"
              />
            </div>
            <button type="button" className="reset-btn" onClick={resetFilters} disabled={isEmpty}>
              ↺ Reset Filter
            </button>
          </div>
        </form>
      </div>

      <div className="panel" style={{ padding: 0 }}>
        {metaLoading && (
          <div className="loading-state"><span className="icon spin">⏳</span>Memuat data...</div>
        )}

        {metaError && (
          <div className="error-state"><span className="icon">⚠️</span>{metaError}</div>
        )}

        {isEmpty && (
          <div className="empty-state"><span className="icon">📭</span>Belum ada data terindeks di folder Drive.</div>
        )}

        {!metaLoading && !metaError && !isEmpty && (
          <React.Fragment>
            <div className="status-row" style={{ padding: '12px 16px 0' }}>
              {searching ? (
                <span><span className="spin">⏳</span> Mencari... (bisa sampai ~1 menit kalau cakupannya banyak desa)</span>
              ) : searchError ? (
                <span style={{ color: 'var(--danger)' }}>⚠️ {searchError}</span>
              ) : needsNarrow ? (
                <span>Ketik nama/NIK/NKK, pilih Kecamatan/Desa, Jenis Kelamin, atau Umur untuk menampilkan data. <span className="badge">mencegah scan berlebihan</span></span>
              ) : hasSearched ? (
                <span>Menampilkan <b className="mono">{results.length}</b> hasil {results.length >= 200 && '(dibatasi 200)'} dari <b className="mono">{scanned.toLocaleString('id-ID')}</b> data dipindai</span>
              ) : 'Menunggu pencarian...'}
            </div>

            {!searching && !searchError && !needsNarrow && hasSearched && results.length === 0 && (
              <div className="empty-state"><span className="icon">🔍</span>Tidak ada data yang cocok.</div>
            )}

            {results.length > 0 && (
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Nama</th>
                      <th>NIK</th>
                      <th>NKK</th>
                      <th>TTL</th>
                      <th>Umur</th>
                      <th>JK</th>
                      <th>Alamat Lengkap</th>
                    </tr>
                  </thead>
                  <tbody>
                    {results.map((r, i) => (
                      <tr key={i}>
                        <td className="nama">{r[2]}</td>
                        <td className="mono-cell">{r[1]}</td>
                        <td className="mono-cell">{r[0]}</td>
                        <td className="mono-cell">{r[3]}</td>
                        <td className="mono-cell">{r[10] || '-'}</td>
                        <td>{r[4]}</td>
                        <td className="addr">
                          {r[5]}{r[6] && r[6] !== '0' ? `, RT ${r[6]}` : ''}{r[7] && r[7] !== '0' ? `/RW ${r[7]}` : ''}, {r[9]}, {r[8]}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </React.Fragment>
        )}
      </div>

      <div className="footer-note">Filter Data Pemilih · Admin · kangrozif.my.id</div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
