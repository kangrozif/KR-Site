<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Filter Data Pemilih — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #12141c;
    --panel: #191c27;
    --panel-alt: #1f2330;
    --border: #2a2e3d;
    --gold: #e3b341;
    --gold-dim: #8a6c2c;
    --text: #eaecf3;
    --text-muted: #8890a6;
    --text-faint: #565d70;
    --danger: #ff6b6b;
    --danger-dim: #4a2323;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 800px 400px at 20% -10%, rgba(227,179,65,0.06), transparent),
      radial-gradient(ellipse 600px 300px at 90% 0%, rgba(62,150,213,0.04), transparent);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  #root { max-width: 1040px; margin: 0 auto; padding: 24px 16px 60px; }

  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
  .header-eyebrow { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
  .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .header-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  .stat-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat-pill {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 14px; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px;
  }
  .stat-pill b { color: var(--text); font-family: 'JetBrains Mono', monospace; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .panel-title { font-size: 13px; font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }

  .filter-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 10px; }
  @media (max-width: 700px) { .filter-grid { grid-template-columns: 1fr; } }

  .filter-grid-2 { display: grid; grid-template-columns: 1.4fr 1fr 0.7fr 0.7fr; gap: 10px; margin-top: 10px; }
  @media (max-width: 700px) { .filter-grid-2 { grid-template-columns: 1fr 1fr; } }
  .umur-row { display: flex; gap: 6px; align-items: center; }
  .umur-row .input { text-align: center; }
  .umur-row span { color: var(--text-faint); font-size: 12px; white-space: nowrap; }

  .search-btn {
    background: var(--gold); color: #1a1608; border: none; border-radius: 8px;
    padding: 0 18px; font-size: 15px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; min-width: 46px;
  }
  .search-btn:hover { filter: brightness(1.08); }
  .search-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .reset-btn {
    background: transparent; color: var(--text-muted); border: 1px solid var(--border);
    padding: 0 14px; border-radius: 8px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
  }
  .reset-btn:hover { color: var(--text); border-color: var(--text-faint); }

  .input, .select {
    background: var(--panel-alt); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 13px; width: 100%; font-family: inherit;
  }
  .input:focus, .select:focus { outline: 2px solid var(--gold-dim); outline-offset: 1px; }
  .input::placeholder { color: var(--text-faint); }
  .select:disabled { color: var(--text-faint); cursor: not-allowed; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-faint); padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:hover { background: var(--panel-alt); }
  td.nama { font-weight: 600; color: var(--text); }
  td.mono-cell { font-family: 'JetBrains Mono', monospace; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
  td.addr { color: var(--text-muted); font-size: 12.5px; }

  .status-row { padding: 8px 4px 12px; font-size: 12px; color: var(--text-faint); }
  .empty-state, .loading-state, .error-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
  .error-state { color: var(--danger); }
  .empty-state .icon, .loading-state .icon, .error-state .icon { font-size: 24px; display: block; margin-bottom: 8px; }

  .badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--panel-alt); color: var(--text-muted); }

  .footer-note { text-align: center; font-size: 11px; color: var(--text-faint); margin-top: 30px; }

  .spin { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .login-wrap { min-height: calc(100vh - 48px); display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px; width: 100%; max-width: 340px; }
  .login-icon { font-size: 26px; margin-bottom: 10px; }
  .login-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .login-sub { font-size: 12.5px; color: var(--text-muted); margin: 0 0 20px; }
  .login-btn {
    width: 100%; margin-top: 10px; background: var(--gold); color: #1a1608; border: none;
    padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .login-btn:hover { filter: brightness(1.08); }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .login-error { color: var(--danger); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

// Ganti dengan Web App URL hasil deploy Apps Script (admin-appscript/Code.gs)
const API_URL = 'https://script.google.com/macros/s/AKfycbwasc_tlV4zllzv0cUnhK7HU7Mp6L-c-DAIez5TOG7_zDaVRRvdmnVHw5qqXrBPL0xScg/exec';

const TOKEN_STORAGE_KEY = 'dpt_admin_token';

function LoginScreen({ onSuccess }) {
  const [value, setValue] = useState('');
  const [checking, setChecking] = useState(false);
  const [error, setError] = useState('');

  const submit = (e) => {
    e.preventDefault();
    if (!value.trim()) return;
    setChecking(true);
    setError('');
    fetch(API_URL + '?action=meta&token=' + encodeURIComponent(value.trim()))
      .then(r => r.json())
      .then(data => {
        if (data.unauthorized) {
          setError('Password salah.');
          return;
        }
        if (data.error) {
          setError(data.error);
          return;
        }
        sessionStorage.setItem(TOKEN_STORAGE_KEY, value.trim());
        onSuccess(value.trim());
      })
      .catch(() => setError('Gagal menghubungi server. Cek koneksi.'))
      .finally(() => setChecking(false));
  };

  return (
    <div className="login-wrap">
      <form className="login-card" onSubmit={submit}>
        <div className="login-icon">🔒</div>
        <div className="login-title">Akses Admin</div>
        <div className="login-sub">Masukkan password untuk membuka data pemilih.</div>
        <input
          className="input"
          type="password"
          placeholder="Password"
          value={value}
          onChange={e => setValue(e.target.value)}
          autoFocus
        />
        {error && <div className="login-error">⚠️ {error}</div>}
        <button className="login-btn" type="submit" disabled={checking}>
          {checking ? 'Memeriksa...' : 'Masuk'}
        </button>
      </form>
    </div>
  );
}

function App() {
  const [token, setToken] = useState(() => sessionStorage.getItem(TOKEN_STORAGE_KEY) || '');
  const [meta, setMeta] = useState({ kecamatan: {}, totalRecords: 0 });
  const [metaLoading, setMetaLoading] = useState(true);
  const [metaError, setMetaError] = useState('');

  const [namaQuery, setNamaQuery] = useState('');
  const [nikQuery, setNikQuery] = useState('');
  const [jkFilter, setJkFilter] = useState('SEMUA');
  const [umurMin, setUmurMin] = useState('');
  const [umurMax, setUmurMax] = useState('');
  const [selKec, setSelKec] = useState('SEMUA');
  const [selDesa, setSelDesa] = useState('SEMUA');

  const [results, setResults] = useState([]);
  const [needsNarrow, setNeedsNarrow] = useState(false);
  const [scanned, setScanned] = useState(0);
  const [searching, setSearching] = useState(false);
  const [searchError, setSearchError] = useState('');
  const [hasSearched, setHasSearched] = useState(false);

  const requestIdRef = useRef(0);

  // Cegah klik kanan & shortcut devtools (hanya penghalang ringan, bukan proteksi sungguhan)
  useEffect(() => {
    const blockContextMenu = (e) => e.preventDefault();
    const blockKeys = (e) => {
      const k = e.key.toLowerCase();
      if (e.key === 'F12') { e.preventDefault(); return false; }
      if ((e.ctrlKey || e.metaKey) && k === 'u') { e.preventDefault(); return false; }
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].includes(k)) { e.preventDefault(); return false; }
    };
    document.addEventListener('contextmenu', blockContextMenu);
    document.addEventListener('keydown', blockKeys);
    return () => {
      document.removeEventListener('contextmenu', blockContextMenu);
      document.removeEventListener('keydown', blockKeys);
    };
  }, []);

  // Auto-logout setelah 20 menit tidak ada aktivitas
  useEffect(() => {
    if (!token) return;
    let timer;
    const scheduleLogout = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        sessionStorage.removeItem(TOKEN_STORAGE_KEY);
        setToken('');
      }, 20 * 60 * 1000);
    };
    const events = ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'];
    events.forEach(ev => window.addEventListener(ev, scheduleLogout));
    scheduleLogout();
    return () => {
      clearTimeout(timer);
      events.forEach(ev => window.removeEventListener(ev, scheduleLogout));
    };
  }, [token]);

  useEffect(() => {
    if (!token) return;
    fetch(API_URL + '?action=meta&token=' + encodeURIComponent(token))
      .then(r => r.json())
      .then(data => {
        if (data.unauthorized) {
          sessionStorage.removeItem(TOKEN_STORAGE_KEY);
          setToken('');
          return;
        }
        if (data.error) throw new Error(data.error);
        setMeta(data);
      })
      .catch(err => setMetaError(err.message || 'Gagal memuat data. Cek API_URL sudah diisi Web App URL yang benar.'))
      .finally(() => setMetaLoading(false));
  }, [token]);

  const kecamatanList = useMemo(() => Object.keys(meta.kecamatan || {}).sort(), [meta]);
  const desaList = useMemo(() => {
    if (selKec === 'SEMUA') return [];
    return (meta.kecamatan[selKec] || []).map(d => d.desa).sort();
  }, [meta, selKec]);
  const totalDesa = useMemo(
    () => Object.values(meta.kecamatan || {}).reduce((s, arr) => s + arr.length, 0),
    [meta]
  );

  const runSearch = useCallback(() => {
    setHasSearched(true);
    setSearchError('');
    setSearching(true);
    setNeedsNarrow(false);

    const myRequestId = ++requestIdRef.current;

    const url = API_URL + '?action=search'
      + '&token=' + encodeURIComponent(token)
      + '&nama=' + encodeURIComponent(namaQuery.trim())
      + '&nik=' + encodeURIComponent(nikQuery.trim())
      + '&jk=' + encodeURIComponent(jkFilter)
      + '&umurMin=' + encodeURIComponent(umurMin)
      + '&umurMax=' + encodeURIComponent(umurMax)
      + '&kec=' + encodeURIComponent(selKec)
      + '&desa=' + encodeURIComponent(selDesa);

    fetch(url)
      .then(r => r.json())
      .then(data => {
        if (myRequestId !== requestIdRef.current) return; // respons usang, abaikan
        if (data.unauthorized) {
          sessionStorage.removeItem(TOKEN_STORAGE_KEY);
          setToken('');
          throw new Error('Sesi berakhir, silakan login ulang.');
        }
        if (data.error) throw new Error(data.error);
        if (data.needsNarrow) {
          setNeedsNarrow(true);
          setResults([]);
          setScanned(0);
        } else {
          setResults(data.results || []);
          setScanned(data.scanned || 0);
        }
      })
      .catch(err => {
        if (myRequestId !== requestIdRef.current) return; // respons usang, abaikan
        setSearchError(err.message || 'Gagal mengambil hasil pencarian.');
      })
      .finally(() => {
        if (myRequestId !== requestIdRef.current) return; // respons usang, abaikan
        setSearching(false);
      });
  }, [namaQuery, nikQuery, jkFilter, umurMin, umurMax, selKec, selDesa, token]);

  // Dropdown Kecamatan/Desa/Jenis Kelamin: auto-search (aksi diskrit, aman dari race condition)
  useEffect(() => {
    if (metaLoading || kecamatanList.length === 0) return;
    runSearch();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selKec, selDesa, jkFilter, metaLoading]);

  const handleNamaSubmit = (e) => {
    e.preventDefault();
    runSearch();
  };

  const resetFilters = () => {
    setNamaQuery('');
    setNikQuery('');
    setJkFilter('SEMUA');
    setUmurMin('');
    setUmurMax('');
    setSelKec('SEMUA');
    setSelDesa('SEMUA');
    setResults([]);
    setHasSearched(false);
    setNeedsNarrow(false);
    setSearchError('');
    setScanned(0);
  };

  const handleLogout = () => {
    sessionStorage.removeItem(TOKEN_STORAGE_KEY);
    setToken('');
  };

  if (!token) {
    return <LoginScreen onSuccess={setToken} />;
  }

  const isEmpty = !metaLoading && kecamatanList.length === 0 && !metaError;

  return (
    <React.Fragment>
      <div className="header">
        <div>
          <div className="header-eyebrow">Admin · Data Pemilih</div>
          <h1 className="header-title">Filter &amp; Pencarian Data</h1>
          <div className="header-sub">Cari berdasarkan Nama, Kecamatan, dan Desa/Kelurahan</div>
        </div>
        <div className="stat-row">
          <div className="stat-pill">👥 <b>{(meta.totalRecords || 0).toLocaleString('id-ID')}</b> data</div>
          <div className="stat-pill">📍 <b>{kecamatanList.length}</b> kec · <b>{totalDesa}</b> desa</div>
          <button onClick={handleLogout} className="stat-pill" style={{ cursor: 'pointer', border: 'none', color: 'var(--danger)' }}>
            🚪 Keluar
          </button>
        </div>
      </div>

      <div className="panel">
        <form className="filter-grid" onSubmit={handleNamaSubmit}>
          <input
            className="input"
            placeholder="Ketik nama untuk mencari..."
            value={namaQuery}
            onChange={e => setNamaQuery(e.target.value)}
            disabled={isEmpty}
          />
          <select
            className="select"
            value={selKec}
            onChange={e => { setSelKec(e.target.value); setSelDesa('SEMUA'); }}
            disabled={isEmpty}
          >
            <option value="SEMUA">Semua Kecamatan</option>
            {kecamatanList.map(k => <option key={k} value={k}>{k}</option>)}
          </select>
          <select
            className="select"
            value={selDesa}
            onChange={e => setSelDesa(e.target.value)}
            disabled={isEmpty || selKec === 'SEMUA'}
          >
            <option value="SEMUA">Semua Desa</option>
            {desaList.map(d => <option key={d} value={d}>{d}</option>)}
          </select>
          <button type="submit" className="search-btn" disabled={isEmpty || searching} title="Cari">
            🔎
          </button>
        </form>

        <div className="filter-grid-2">
          <input
            className="input"
            placeholder="Cari NIK..."
            value={nikQuery}
            onChange={e => setNikQuery(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); runSearch(); } }}
            disabled={isEmpty}
            inputMode="numeric"
          />
          <select
            className="select"
            value={jkFilter}
            onChange={e => setJkFilter(e.target.value)}
            disabled={isEmpty}
          >
            <option value="SEMUA">Semua JK</option>
            <option value="L">Laki-laki (L)</option>
            <option value="P">Perempuan (P)</option>
          </select>
          <div className="umur-row">
            <input
              className="input"
              placeholder="Min"
              value={umurMin}
              onChange={e => setUmurMin(e.target.value.replace(/[^0-9]/g, ''))}
              onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); runSearch(); } }}
              disabled={isEmpty}
              inputMode="numeric"
            />
            <span>—</span>
            <input
              className="input"
              placeholder="Max"
              value={umurMax}
              onChange={e => setUmurMax(e.target.value.replace(/[^0-9]/g, ''))}
              onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); runSearch(); } }}
              disabled={isEmpty}
              inputMode="numeric"
            />
          </div>
          <button type="button" className="reset-btn" onClick={resetFilters} disabled={isEmpty}>
            ↺ Reset Filter
          </button>
        </div>
      </div>

      <div className="panel" style={{ padding: 0 }}>
        {metaLoading && (
          <div className="loading-state"><span className="icon spin">⏳</span>Memuat data...</div>
        )}

        {metaError && (
          <div className="error-state"><span className="icon">⚠️</span>{metaError}</div>
        )}

        {isEmpty && (
          <div className="empty-state"><span className="icon">📭</span>Belum ada data terindeks di folder Drive.</div>
        )}

        {!metaLoading && !metaError && !isEmpty && (
          <React.Fragment>
            <div className="status-row" style={{ padding: '12px 16px 0' }}>
              {searching ? (
                <span><span className="spin">⏳</span> Mencari...</span>
              ) : searchError ? (
                <span style={{ color: 'var(--danger)' }}>⚠️ {searchError}</span>
              ) : needsNarrow ? (
                <span>Ketik nama/NIK, pilih Kecamatan/Desa, Jenis Kelamin, atau Umur untuk menampilkan data. <span className="badge">mencegah scan berlebihan</span></span>
              ) : hasSearched ? (
                <span>Menampilkan <b className="mono">{results.length}</b> hasil {results.length >= 200 && '(dibatasi 200)'} dari <b className="mono">{scanned.toLocaleString('id-ID')}</b> data dipindai</span>
              ) : 'Menunggu pencarian...'}
            </div>

            {!searching && !searchError && !needsNarrow && hasSearched && results.length === 0 && (
              <div className="empty-state"><span className="icon">🔍</span>Tidak ada data yang cocok.</div>
            )}

            {results.length > 0 && (
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Nama</th>
                      <th>NIK</th>
                      <th>NKK</th>
                      <th>TTL</th>
                      <th>Umur</th>
                      <th>JK</th>
                      <th>Alamat Lengkap</th>
                    </tr>
                  </thead>
                  <tbody>
                    {results.map((r, i) => (
                      <tr key={i}>
                        <td className="nama">{r[2]}</td>
                        <td className="mono-cell">{r[1]}</td>
                        <td className="mono-cell">{r[0]}</td>
                        <td className="mono-cell">{r[3]}</td>
                        <td className="mono-cell">{r[10] || '-'}</td>
                        <td>{r[4]}</td>
                        <td className="addr">
                          {r[5]}{r[6] && r[6] !== '0' ? `, RT ${r[6]}` : ''}{r[7] && r[7] !== '0' ? `/RW ${r[7]}` : ''}, {r[9]}, {r[8]}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </React.Fragment>
        )}
      </div>

      <div className="footer-note">Filter Data Pemilih · Admin · kangrozif.my.id</div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
