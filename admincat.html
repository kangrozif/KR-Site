<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Persetujuan Pendaftar — Admin CAT Petugas Haji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #12141c;
    --panel: #191c27;
    --panel-alt: #1f2330;
    --border: #2a2e3d;
    --gold: #e3b341;
    --gold-dim: #8a6c2c;
    --text: #eaecf3;
    --text-muted: #8890a6;
    --text-faint: #565d70;
    --danger: #ff6b6b;
    --danger-dim: #4a2323;
    --success: #4ade80;
    --success-dim: #1c3a28;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 800px 400px at 20% -10%, rgba(227,179,65,0.06), transparent),
      radial-gradient(ellipse 600px 300px at 90% 0%, rgba(62,150,213,0.04), transparent);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  #root { max-width: 1040px; margin: 0 auto; padding: 24px 16px 60px; }

  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
  .header-eyebrow { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
  .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .header-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  .stat-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat-pill {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 14px; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px;
  }
  .stat-pill b { color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .stat-pill.warn b { color: var(--gold); }
  .stat-pill.ok b { color: var(--success); }
  .stat-pill.bad b { color: var(--danger); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .panel-title { font-size: 13px; font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }

  .filter-grid { display: grid; grid-template-columns: 1.4fr 1fr auto; gap: 10px; }
  @media (max-width: 700px) { .filter-grid { grid-template-columns: 1fr; } }

  .tab-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab-btn {
    background: var(--panel-alt); border: 1px solid var(--border); color: var(--text-muted);
    padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .tab-btn.active { background: var(--gold); color: #1a1608; border-color: var(--gold); }
  .tab-btn .count { opacity: 0.75; margin-left: 4px; }

  .search-btn {
    background: var(--gold); color: #1a1608; border: none; border-radius: 8px;
    padding: 0 18px; font-size: 15px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; min-width: 46px;
  }
  .search-btn:hover { filter: brightness(1.08); }
  .search-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .reset-btn {
    background: transparent; color: var(--text-muted); border: 1px solid var(--border);
    padding: 0 14px; border-radius: 8px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
  }
  .reset-btn:hover { color: var(--text); border-color: var(--text-faint); }

  .input, .select {
    background: var(--panel-alt); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 13px; width: 100%; font-family: inherit;
  }
  .input:focus, .select:focus { outline: 2px solid var(--gold-dim); outline-offset: 1px; }
  .input::placeholder { color: var(--text-faint); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-faint); padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:hover { background: var(--panel-alt); }
  td.nama { font-weight: 600; color: var(--text); }
  td.mono-cell { font-family: 'JetBrains Mono', monospace; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
  td.sub { color: var(--text-muted); font-size: 12.5px; }

  .badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600; display: inline-block; white-space: nowrap; }
  .badge.menunggu { background: var(--gold-dim); color: var(--gold); }
  .badge.disetujui { background: var(--success-dim); color: var(--success); }
  .badge.ditolak { background: var(--danger-dim); color: var(--danger); }

  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .act-btn {
    border: 1px solid var(--border); background: var(--panel-alt); color: var(--text);
    padding: 6px 12px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .act-btn:hover { border-color: var(--text-faint); }
  .act-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .act-btn.approve { background: var(--success-dim); color: var(--success); border-color: transparent; }
  .act-btn.reject { background: var(--danger-dim); color: var(--danger); border-color: transparent; }
  .act-btn.undo { background: transparent; color: var(--text-muted); }

  .status-row { padding: 8px 4px 12px; font-size: 12px; color: var(--text-faint); }
  .empty-state, .loading-state, .error-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
  .error-state { color: var(--danger); }
  .empty-state .icon, .loading-state .icon, .error-state .icon { font-size: 24px; display: block; margin-bottom: 8px; }

  .footer-note { text-align: center; font-size: 11px; color: var(--text-faint); margin-top: 30px; }

  .spin { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .login-wrap { min-height: calc(100vh - 48px); display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px; width: 100%; max-width: 340px; }
  .login-icon { font-size: 26px; margin-bottom: 10px; }
  .login-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .login-sub { font-size: 12.5px; color: var(--text-muted); margin: 0 0 20px; }
  .login-btn {
    width: 100%; margin-top: 10px; background: var(--gold); color: #1a1608; border: none;
    padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .login-btn:hover { filter: brightness(1.08); }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .login-error { color: var(--danger); font-size: 12px; margin-top: 10px; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10,11,16,0.7); display: flex;
    align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px; width: 100%; max-width: 380px; }
  .modal-title { font-size: 15px; font-weight: 700; margin: 0 0 6px; }
  .modal-sub { font-size: 12.5px; color: var(--text-muted); margin: 0 0 16px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions button { flex: 1; }
  textarea.input { resize: vertical; min-height: 70px; font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

// Ganti dengan Web App URL hasil deploy Code.gs (CAT Petugas Haji backend)
const API_URL = 'GANTI_DENGAN_URL_WEB_APP_ANDA';

const TOKEN_STORAGE_KEY = 'cat_haji_admin_token';

function LoginScreen({ onSuccess }) {
  const [value, setValue] = useState('');
  const [checking, setChecking] = useState(false);
  const [error, setError] = useState('');

  const submit = (e) => {
    e.preventDefault();
    if (!value.trim()) return;
    setChecking(true);
    setError('');
    fetch(API_URL + '?action=meta&token=' + encodeURIComponent(value.trim()))
      .then(r => r.json())
      .then(data => {
        if (data.unauthorized) {
          setError('Password salah.');
          return;
        }
        if (!data.ok) {
          setError(data.error || 'Gagal masuk.');
          return;
        }
        sessionStorage.setItem(TOKEN_STORAGE_KEY, value.trim());
        onSuccess(value.trim());
      })
      .catch(() => setError('Gagal menghubungi server. Cek koneksi.'))
      .finally(() => setChecking(false));
  };

  return (
    <div className="login-wrap">
      <form className="login-card" onSubmit={submit}>
        <div className="login-icon">🔒</div>
        <div className="login-title">Admin Persetujuan Pendaftar</div>
        <div className="login-sub">Masukkan token admin untuk membuka daftar pendaftar CAT Petugas Haji.</div>
        <input
          className="input"
          type="password"
          placeholder="Token admin"
          value={value}
          onChange={e => setValue(e.target.value)}
          autoFocus
        />
        {error && <div className="login-error">⚠️ {error}</div>}
        <button className="login-btn" type="submit" disabled={checking}>
          {checking ? 'Memeriksa...' : 'Masuk'}
        </button>
      </form>
    </div>
  );
}

function badgeClass(status) {
  if (status === 'Disetujui') return 'disetujui';
  if (status === 'Ditolak') return 'ditolak';
  return 'menunggu';
}

function RejectModal({ row, onCancel, onConfirm, submitting }) {
  const [note, setNote] = useState('');
  return (
    <div className="modal-backdrop" onClick={onCancel}>
      <div className="modal-card" onClick={e => e.stopPropagation()}>
        <div className="modal-title">Tolak Pendaftaran</div>
        <div className="modal-sub">{row['Nama']} — {row['Instansi/Satuan Kerja']}</div>
        <textarea
          className="input"
          placeholder="Catatan untuk peserta (opsional), misal: data belum lengkap"
          value={note}
          onChange={e => setNote(e.target.value)}
        />
        <div className="modal-actions">
          <button className="act-btn" onClick={onCancel} disabled={submitting}>Batal</button>
          <button className="act-btn reject" onClick={() => onConfirm(note)} disabled={submitting}>
            {submitting ? 'Memproses…' : 'Tolak Pendaftaran'}
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [token, setToken] = useState(() => sessionStorage.getItem(TOKEN_STORAGE_KEY) || '');
  const [meta, setMeta] = useState({ totalPendaftar: 0, menunggu: 0, disetujui: 0, ditolak: 0 });
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState('');
  const [tab, setTab] = useState('Menunggu');
  const [query, setQuery] = useState('');
  const [busyId, setBusyId] = useState('');
  const [rejectTarget, setRejectTarget] = useState(null);

  const loadData = useCallback(() => {
    if (!token) return;
    setLoading(true);
    setLoadError('');
    Promise.all([
      fetch(API_URL + '?action=meta&token=' + encodeURIComponent(token)).then(r => r.json()),
      fetch(API_URL + '?action=dump_pendaftar&token=' + encodeURIComponent(token)).then(r => r.json()),
    ])
      .then(([metaData, dumpData]) => {
        if (metaData.unauthorized || dumpData.unauthorized) {
          sessionStorage.removeItem(TOKEN_STORAGE_KEY);
          setToken('');
          return;
        }
        if (!dumpData.ok) {
          setLoadError(dumpData.error || 'Gagal memuat data pendaftar.');
          return;
        }
        setMeta(metaData);
        setRows((dumpData.rows || []).slice().reverse());
      })
      .catch(() => setLoadError('Gagal menghubungi server. Cek koneksi.'))
      .finally(() => setLoading(false));
  }, [token]);

  useEffect(() => { loadData(); }, [loadData]);

  const handleLogout = () => {
    sessionStorage.removeItem(TOKEN_STORAGE_KEY);
    setToken('');
  };

  const updateStatus = (id, status, note) => {
    setBusyId(id);
    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ token, type: 'admin_update_status', id, status, note: note || '' }),
    })
      .then(r => r.json())
      .then(data => {
        if (!data.ok) {
          alert(data.error || 'Gagal memperbarui status.');
          return;
        }
        loadData();
      })
      .catch(() => alert('Gagal menghubungi server.'))
      .finally(() => { setBusyId(''); setRejectTarget(null); });
  };

  const filtered = useMemo(() => {
    let list = rows;
    if (tab !== 'Semua') list = list.filter(r => r['Status'] === tab);
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter(r =>
        String(r['Nama'] || '').toLowerCase().includes(q) ||
        String(r['Instansi/Satuan Kerja'] || '').toLowerCase().includes(q) ||
        String(r['Kontak (WA/Email)'] || '').toLowerCase().includes(q)
      );
    }
    return list;
  }, [rows, tab, query]);

  if (!token) {
    return <LoginScreen onSuccess={setToken} />;
  }

  const fmtDate = (v) => {
    if (!v) return '—';
    const d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  };

  return (
    <React.Fragment>
      <div className="header">
        <div>
          <div className="header-eyebrow">Admin · CAT Petugas Haji</div>
          <h1 className="header-title">Persetujuan Pendaftar</h1>
          <div className="header-sub">Setujui atau tolak pendaftar sebelum mereka bisa mengerjakan uji coba</div>
        </div>
        <div className="stat-row">
          <div className="stat-pill warn">⏳ <b>{meta.menunggu || 0}</b> menunggu</div>
          <div className="stat-pill ok">✅ <b>{meta.disetujui || 0}</b> disetujui</div>
          <div className="stat-pill bad">✖️ <b>{meta.ditolak || 0}</b> ditolak</div>
          <button onClick={loadData} className="stat-pill" style={{ cursor: 'pointer', border: 'none' }}>
            {loading ? <span className="spin">⏳</span> : '🔄'} Muat Ulang
          </button>
          <button onClick={handleLogout} className="stat-pill" style={{ cursor: 'pointer', border: 'none', color: 'var(--danger)' }}>
            🚪 Keluar
          </button>
        </div>
      </div>

      <div className="panel">
        <div className="tab-row">
          {['Menunggu', 'Disetujui', 'Ditolak', 'Semua'].map(t => (
            <button
              key={t}
              className={'tab-btn' + (tab === t ? ' active' : '')}
              onClick={() => setTab(t)}
            >
              {t}
              <span className="count">
                {t === 'Semua' ? rows.length : rows.filter(r => r['Status'] === t).length}
              </span>
            </button>
          ))}
        </div>
        <div className="filter-grid">
          <input
            className="input"
            placeholder="Cari nama, instansi, atau kontak..."
            value={query}
            onChange={e => setQuery(e.target.value)}
          />
          <div />
          <button type="button" className="reset-btn" onClick={() => setQuery('')}>↺ Reset</button>
        </div>
      </div>

      <div className="panel" style={{ padding: 0 }}>
        {loading && (
          <div className="loading-state"><span className="icon spin">⏳</span>Memuat data pendaftar...</div>
        )}

        {!loading && loadError && (
          <div className="error-state"><span className="icon">⚠️</span>{loadError}</div>
        )}

        {!loading && !loadError && rows.length === 0 && (
          <div className="empty-state"><span className="icon">📭</span>Belum ada pendaftar masuk.</div>
        )}

        {!loading && !loadError && rows.length > 0 && (
          <React.Fragment>
            <div className="status-row" style={{ padding: '12px 16px 0' }}>
              Menampilkan <b className="mono">{filtered.length}</b> dari <b className="mono">{rows.length}</b> pendaftar
            </div>

            {filtered.length === 0 && (
              <div className="empty-state"><span className="icon">🔍</span>Tidak ada pendaftar yang cocok.</div>
            )}

            {filtered.length > 0 && (
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Nama</th>
                      <th>Instansi/Satuan Kerja</th>
                      <th>Kontak</th>
                      <th>Waktu Daftar</th>
                      <th>Status</th>
                      <th>Aksi</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.map((r, i) => {
                      const id = r['ID Pendaftar'];
                      const isBusy = busyId === id;
                      const status = r['Status'] || 'Menunggu';
                      return (
                        <tr key={id || i}>
                          <td className="nama">{r['Nama']}</td>
                          <td className="sub">{r['Instansi/Satuan Kerja']}</td>
                          <td className="mono-cell">{r['Kontak (WA/Email)']}</td>
                          <td className="sub">{fmtDate(r['Waktu Daftar'])}</td>
                          <td><span className={'badge ' + badgeClass(status)}>{status}</span></td>
                          <td>
                            <div className="row-actions">
                              {status !== 'Disetujui' && (
                                <button
                                  className="act-btn approve"
                                  disabled={isBusy}
                                  onClick={() => updateStatus(id, 'Disetujui', '')}
                                >
                                  {isBusy ? '…' : '✓ Setujui'}
                                </button>
                              )}
                              {status !== 'Ditolak' && (
                                <button
                                  className="act-btn reject"
                                  disabled={isBusy}
                                  onClick={() => setRejectTarget(r)}
                                >
                                  ✕ Tolak
                                </button>
                              )}
                              {status !== 'Menunggu' && (
                                <button
                                  className="act-btn undo"
                                  disabled={isBusy}
                                  onClick={() => updateStatus(id, 'Menunggu', '')}
                                >
                                  ↺ Set ulang
                                </button>
                              )}
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </React.Fragment>
        )}
      </div>

      {rejectTarget && (
        <RejectModal
          row={rejectTarget}
          submitting={busyId === rejectTarget['ID Pendaftar']}
          onCancel={() => setRejectTarget(null)}
          onConfirm={(note) => updateStatus(rejectTarget['ID Pendaftar'], 'Ditolak', note)}
        />
      )}

      <div className="footer-note">Persetujuan Pendaftar · CAT Petugas Haji · kangrozif.my.id</div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
