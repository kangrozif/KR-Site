<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seleksi Tartil Al-Qur'an</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16241F;
    --green-deep:#1B4235;
    --green-mid:#2F6B54;
    --green-pale:#E1E9DF;
    --gold:#B8923B;
    --gold-soft:#D9C58B;
    --paper:#F5F2E7;
    --paper-dim:#EBE6D3;
    --line:#D3CBAE;
    --red:#A73B2A;
    --font-display:'Fraunces', serif;
    --font-ui:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-ui);color:var(--ink);background:var(--paper);}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--font-ui);cursor:pointer;}
  input,textarea{font-family:var(--font-ui);}

  .home{
    min-height:100vh;
    background:radial-gradient(circle at 30% 0%, #234E3F 0%, var(--green-deep) 55%, #123128 100%);
    color:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 24px;text-align:center;
  }
  .home .eyebrow{color:var(--gold-soft);font-size:14px;letter-spacing:.02em;margin-bottom:10px;}
  .home h1{font-family:var(--font-display);font-weight:600;font-size:clamp(30px,6vw,46px);margin:0 0 8px;}
  .home p.sub{color:#C9D6CC;font-size:15px;margin:0 0 40px;max-width:360px;}
  .role-group{margin-bottom:28px;width:100%;max-width:380px;}
  .role-group h2{font-size:12px;text-transform:none;color:var(--gold-soft);margin:0 0 10px;font-weight:600;letter-spacing:.02em;}
  .role-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .pill{
    border:1px solid rgba(217,197,139,.5);background:transparent;color:var(--paper);
    padding:12px 18px;border-radius:3px;font-size:15px;font-weight:500;
    transition:background .15s,border-color .15s;
  }
  .pill:hover{background:rgba(217,197,139,.12);border-color:var(--gold);}
  .pill.wide{flex:1 1 100%;}
  .home .note{margin-top:36px;font-size:12.5px;color:#9FB2A5;max-width:360px;line-height:1.5;}

  .topbar{
    background:var(--green-deep);color:var(--paper);
    padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:5;
  }
  .topbar .back{font-size:14px;color:var(--gold-soft);background:none;border:none;}
  .topbar h1{font-family:var(--font-display);font-size:19px;margin:0;font-weight:600;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 18px 60px;}

  .section-label{font-size:12px;color:var(--green-mid);font-weight:600;margin:24px 0 10px;}
  .grid-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .num-btn{
    aspect-ratio:1;border:1px solid var(--line);background:var(--paper-dim);
    border-radius:3px;font-size:16px;font-weight:600;color:var(--ink);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .num-btn.done{background:var(--green-pale);border-color:var(--green-mid);}
  .num-btn.done::after{content:'✓';position:absolute;top:2px;right:4px;font-size:10px;color:var(--green-mid);}
  .num-btn.active{outline:2px solid var(--gold);outline-offset:1px;}

  .field{margin-bottom:16px;}
  .field label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px;}
  .field label .max{font-weight:400;color:#7A7568;font-size:12.5px;}
  .field input[type=number]{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:3px;
    font-size:16px;background:#fff;
  }
  .field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:3px;
    font-size:14px;background:#fff;min-height:64px;resize:vertical;
  }
  .btn-primary{
    background:var(--green-deep);color:var(--paper);border:none;padding:13px 20px;
    border-radius:3px;font-size:15px;font-weight:600;width:100%;
  }
  .btn-primary:disabled{opacity:.6;}
  .btn-secondary{
    background:transparent;border:1px solid var(--green-deep);color:var(--green-deep);
    padding:10px 16px;border-radius:3px;font-size:14px;font-weight:600;
  }
  .msg-ok{color:var(--green-mid);font-size:13.5px;margin-top:10px;}
  .msg-err{color:var(--red);font-size:13.5px;margin-top:10px;}
  .kategori-note{background:var(--paper-dim);border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-size:13px;margin-bottom:20px;color:#4A5A50;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;}
  th{font-size:11.5px;text-transform:none;color:var(--green-mid);font-weight:600;}
  .jstat{display:inline-block;text-align:center;font-size:12px;}
  .jstat.on{color:var(--green-mid);font-weight:700;}
  .jstat.off{color:#C9C2AC;}
  .tag{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);}
  .tag.locked{background:var(--green-pale);border-color:var(--green-mid);color:var(--green-deep);}
  .tag.ready{background:var(--paper-dim);border-color:var(--gold);color:#8A6A1F;}
  .lock-btn{background:var(--gold);border:none;color:#3A2C0A;font-weight:700;font-size:12px;padding:6px 10px;border-radius:3px;}
  .lock-btn:disabled{background:#DAD5C2;color:#9A9683;}
  .name-input{width:100%;border:1px solid var(--line);border-radius:3px;padding:5px 7px;font-size:13px;}

  .board{min-height:100vh;background:var(--green-deep);color:var(--paper);padding:40px 6vw;}
  .board .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:34px;flex-wrap:wrap;gap:10px;}
  .board .head h1{font-family:var(--font-display);font-size:clamp(24px,3vw,34px);margin:0;font-weight:600;}
  .board .progress{color:var(--gold-soft);font-size:15px;}
  .now-card{
    border:1px solid rgba(217,197,139,.4);border-radius:4px;padding:28px 30px;margin-bottom:40px;
    background:rgba(255,255,255,.03);
  }
  .now-card .eyebrow{color:var(--gold-soft);font-size:13px;margin-bottom:8px;}
  .now-card .name{font-family:var(--font-display);font-size:clamp(28px,5vw,44px);font-weight:600;margin:0 0 18px;}
  .breakdown{display:flex;gap:36px;flex-wrap:wrap;align-items:baseline;}
  .breakdown .item .k{font-size:12.5px;color:#B6C7BC;}
  .breakdown .item .v{font-family:var(--font-display);font-size:22px;font-weight:600;}
  .breakdown .final .v{font-size:40px;color:var(--gold-soft);}
  .klasemen h2{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0 0 16px;color:var(--gold-soft);}
  .rank-row{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.12);}
  .rank-row .pos{font-family:var(--font-display);font-size:20px;width:30px;color:var(--gold-soft);}
  .rank-row .nm{flex:1;font-size:17px;}
  .rank-row .sc{font-family:var(--font-display);font-size:22px;font-weight:600;}
  .empty-note{color:#A9BBAF;font-size:14px;margin-top:10px;}
  .refresh-fab{
    position:fixed;bottom:20px;right:20px;background:var(--gold);border:none;color:#3A2C0A;
    font-weight:700;padding:12px 16px;border-radius:30px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/** =========================================================
 *  Jembatan ke backend Google Apps Script (Code.gs) via fetch()
 *  Dipakai karena index.html ini dihosting sendiri (bukan di-serve
 *  langsung oleh Apps Script), sehingga google.script.run TIDAK bisa
 *  dipakai. Ganti API_URL di bawah dengan URL deployment Web App kamu
 *  (Apps Script -> Deploy -> Manage deployments -> salin URL yang
 *  berakhiran /exec).
 *  Bobot nilai akhir: Tajwid 35% | Fashahah & Adab 35% | Lagu & Suara 30%
 * ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbyXUiJF3YNYeuQIBvEop4ZAH0DCXupnOEk-hxQYjEufORgpgH0AJwkeJENs3YLgevj1fw/exec;' // contoh: https://script.google.com/macros/s/AKfycb.../exec

async function apiGet(action, params){
  params = params || {};
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  Object.keys(params).forEach(function(k){
    if(params[k] !== undefined && params[k] !== null) url.searchParams.set(k, params[k]);
  });
  const res = await fetch(url.toString());
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Terjadi kesalahan pada server.');
  return json.data;
}

async function apiPost(action, payload){
  payload = payload || {};
  const res = await fetch(API_URL, {
    method: 'POST',
    // text/plain dipakai agar tidak memicu CORS preflight (OPTIONS),
    // karena Apps Script Web App tidak menangani preflight.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action }, payload))
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'Terjadi kesalahan pada server.');
  return json.data;
}

// gs() dipertahankan sebagai alias supaya sisa kode di bawah tidak perlu diubah.
// Aturan pemetaan: GET untuk baca data, POST untuk aksi yang menulis data.
const WRITE_ACTIONS = ['submitNilai','savePesertaNames','lockPeserta'];
function gs(name, ...args){
  if(WRITE_ACTIONS.includes(name)){
    const payload = buildPayload_(name, args);
    return apiPost(name, payload);
  }
  const payload = buildPayload_(name, args);
  return apiGet(name, payload);
}
function buildPayload_(name, args){
  switch(name){
    case 'getScore':               return { no: args[0] };
    case 'submitNilai':            return { no: args[0], cat: args[1], value: args[2], catatan: args[3] };
    case 'savePesertaNames':       return { list: args[0] };
    case 'lockPeserta':            return { no: args[0] };
    default:                       return {};
  }
}

// Kategori & bobot (harus sinkron dengan Code.gs)
const KATEGORI = {
  tajwid:   { label:'Tajwid',            max:100, bobotPersen:35 },
  fashahah: { label:'Fashahah & Adab',   max:100, bobotPersen:35 },
  lagu:     { label:'Lagu & Suara',      max:100, bobotPersen:30 }
};
const KAT_KEYS = ['tajwid','fashahah','lagu'];

async function getPesertaList(){
  return await gs('getPesertaList');
}

window.addEventListener('hashchange', route);
route();

function route(){
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if(parts[0]==='juri') renderJuri(parts[1]);
  else if(parts[0]==='koordinator') renderKoordinator();
  else if(parts[0]==='display') renderDisplay();
  else renderHome();
}

function renderHome(){
  document.getElementById('app').innerHTML = `
    <div class="home">
      <div class="eyebrow">Musabaqoh Tilawatil Qur'an</div>
      <h1>Seleksi Tartil Al-Qur'an</h1>
      <p class="sub">3 juri, masing-masing menilai 1 kategori (Tajwid 35% · Fashahah 35% · Lagu 30%). Rekap panitia dan layar tampilan tersinkron otomatis.</p>

      <div class="role-group">
        <h2>Untuk Juri</h2>
        <div class="role-row">
          <a class="pill" href="#/juri/tajwid">Juri Tajwid</a>
          <a class="pill" href="#/juri/fashahah">Juri Fashahah &amp; Adab</a>
          <a class="pill" href="#/juri/lagu">Juri Lagu &amp; Suara</a>
        </div>
      </div>

      <div class="role-group">
        <h2>Untuk Panitia</h2>
        <div class="role-row"><a class="pill wide" href="#/koordinator">Panel Koordinator</a></div>
      </div>

      <div class="role-group">
        <h2>Untuk Layar Tampilan</h2>
        <div class="role-row"><a class="pill wide" href="#/display">Buka Display Booth</a></div>
      </div>

      <p class="note">Semua nilai tersimpan di Google Spreadsheet dan dapat dilihat dari perangkat mana pun yang membuka aplikasi ini (juri, panitia, layar tampilan).</p>
    </div>`;
}

function topbar(title, backHash){
  return `<div class="topbar">
    <a class="back" href="${backHash||'#/'}">&larr; Beranda</a>
    <h1>${title}</h1>
    <span style="width:60px"></span>
  </div>`;
}

async function renderJuri(catParam){
  const app = document.getElementById('app');
  if(!catParam || !KATEGORI[catParam]){
    app.innerHTML = topbar('Pilih Kategori Juri') + `<div class="wrap">
      <div class="section-label">Anda juri kategori apa?</div>
      <div class="role-row" style="justify-content:flex-start">
        <a class="pill" style="border-color:var(--green-deep);color:var(--green-deep)" href="#/juri/tajwid">Juri Tajwid</a>
        <a class="pill" style="border-color:var(--green-deep);color:var(--green-deep)" href="#/juri/fashahah">Juri Fashahah &amp; Adab</a>
        <a class="pill" style="border-color:var(--green-deep);color:var(--green-deep)" href="#/juri/lagu">Juri Lagu &amp; Suara</a>
      </div></div>`;
    return;
  }
  const cat = catParam;
  const kat = KATEGORI[cat];
  const peserta = await getPesertaList();
  app.innerHTML = topbar('Juri ' + kat.label, '#/juri') + `<div class="wrap" id="juriBody">Memuat data peserta...</div>`;

  const statuses = {};
  for(const p of peserta){
    const entry = await gs('getScore', p.no);
    statuses[p.no] = !!(entry && entry[cat]);
  }

  document.getElementById('juriBody').innerHTML = `
    <div class="kategori-note">Anda menilai kategori <strong>${kat.label}</strong> (bobot ${kat.bobotPersen}% dari nilai akhir), skala 0–${kat.max} untuk setiap peserta.</div>
    <div class="section-label">Pilih peserta yang baru tampil</div>
    <div class="grid-btns" id="pesertaGrid">
      ${peserta.map(p=>`<button class="num-btn ${statuses[p.no]?'done':''}" data-no="${p.no}" onclick="selectPeserta(${p.no}, '${cat}')">${p.no}</button>`).join('')}
    </div>
    <div id="formArea"></div>`;
}

function selectPeserta(no, cat){
  const kat = KATEGORI[cat];
  document.querySelectorAll('#pesertaGrid .num-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('#pesertaGrid .num-btn[data-no="'+no+'"]').classList.add('active');
  document.getElementById('formArea').innerHTML = `
    <div class="section-label">Nilai ${kat.label} — Peserta No. ${no} <span style="color:#7A7568;font-weight:400">(bobot ${kat.bobotPersen}%)</span></div>
    <div class="field"><label>${kat.label} <span class="max">maks ${kat.max}</span></label>
      <input type="number" id="f_val" min="0" max="${kat.max}" placeholder="0-${kat.max}"></div>
    <div class="field"><label>Catatan (opsional)</label>
      <textarea id="f_catatan" placeholder="Mis: salah makhraj di ayat ke-3"></textarea></div>
    <button class="btn-primary" id="f_submit" onclick="submitNilai(${no}, '${cat}')">Simpan Nilai</button>
    <div id="formMsg"></div>`;
}

async function submitNilai(no, cat){
  const kat = KATEGORI[cat];
  const v = Number(document.getElementById('f_val').value);
  const c = document.getElementById('f_catatan').value.trim();
  const msg = document.getElementById('formMsg');
  const btnSubmit = document.getElementById('f_submit');

  if(isNaN(v) || v<0 || v>kat.max){
    msg.innerHTML = '<div class="msg-err">Periksa kembali nilai, batas maksimal '+kat.max+'.</div>';
    return;
  }

  btnSubmit.disabled = true;
  btnSubmit.textContent = 'Menyimpan...';
  try{
    const res = await gs('submitNilai', no, cat, v, c);
    if(res && res.ok){
      msg.innerHTML = '<div class="msg-ok">Nilai '+kat.label+' untuk peserta No. '+no+' tersimpan.</div>';
      const btn = document.querySelector('#pesertaGrid .num-btn[data-no="'+no+'"]');
      if(btn) btn.classList.add('done');
    } else {
      msg.innerHTML = '<div class="msg-err">'+(res && res.error ? res.error : 'Gagal menyimpan, coba lagi.')+'</div>';
    }
  } catch(e){
    msg.innerHTML = '<div class="msg-err">Gagal menyimpan, coba lagi.</div>';
  } finally {
    btnSubmit.disabled = false;
    btnSubmit.textContent = 'Simpan Nilai';
  }
}

async function renderKoordinator(){
  const app = document.getElementById('app');
  app.innerHTML = topbar('Panel Koordinator') + `<div class="wrap" id="koordBody">Memuat...</div>`;
  await refreshKoordinator();
}

async function refreshKoordinator(){
  const peserta = await getPesertaList();
  const rows = await gs('getAllScoresForKoordinator');

  const body = document.getElementById('koordBody');
  body.innerHTML = `
    <div class="kategori-note">Bobot nilai akhir: Tajwid 35% · Fashahah &amp; Adab 35% · Lagu &amp; Suara 30% (masing-masing skala 0–100).</div>

    <div class="section-label">Nama Peserta</div>
    <div id="nameFields">
      ${peserta.map(p=>`<div class="field" style="margin-bottom:8px"><input class="name-input" id="nm_${p.no}" value="${String(p.nama).replace(/"/g,'&quot;')}" placeholder="Nama peserta No. ${p.no}"></div>`).join('')}
    </div>
    <button class="btn-secondary" onclick="savePesertaNames()">Simpan Nama Peserta</button>
    <div id="nameMsg"></div>

    <div class="section-label" style="margin-top:32px">Rekap Nilai</div>
    <table>
      <tr><th>No</th><th>Nama</th><th>Tajwid (35%)</th><th>Fashahah (35%)</th><th>Lagu (30%)</th><th>Akhir</th><th>Status</th><th></th></tr>
      ${rows.map(r=>`
        <tr>
          <td>${r.no}</td>
          <td>${r.nama}</td>
          ${KAT_KEYS.map(k=>`<td><span class="jstat ${r.vals[k]!==null?'on':'off'}">${r.vals[k]!==null? r.vals[k] : '–'}</span></td>`).join('')}
          <td>${r.final!==null ? r.final : '–'}</td>
          <td>${r.locked ? '<span class="tag locked">Terkunci</span>' : (r.count===3? '<span class="tag ready">Siap</span>' : r.count+'/3 kategori')}</td>
          <td><button class="lock-btn" ${r.count<3 || r.locked ? 'disabled':''} onclick="lockPeserta(${r.no})">${r.locked?'✓':'Kunci'}</button></td>
        </tr>`).join('')}
    </table>
    <button class="btn-secondary" style="margin-top:20px" onclick="refreshKoordinator()">Muat Ulang</button>
  `;
}

async function savePesertaNames(){
  const list = [];
  for(let no=1; no<=10; no++){
    const val = document.getElementById('nm_'+no);
    if(!val) continue;
    list.push({no, nama: (val.value.trim() || ('Peserta '+no))});
  }
  const msgEl = document.getElementById('nameMsg');
  try{
    const res = await gs('savePesertaNames', list);
    msgEl.innerHTML = res && res.ok
      ? '<div class="msg-ok">Nama peserta tersimpan.</div>'
      : '<div class="msg-err">Gagal menyimpan nama.</div>';
  } catch(e){
    msgEl.innerHTML = '<div class="msg-err">Gagal menyimpan nama.</div>';
  }
}

async function lockPeserta(no){
  await gs('lockPeserta', no);
  await refreshKoordinator();
}

let displayTimer = null;
async function renderDisplay(){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="board" id="boardBody">Memuat papan nilai...</div>
    <button class="refresh-fab" onclick="refreshDisplay()">Perbarui</button>`;
  await refreshDisplay();
  if(displayTimer) clearInterval(displayTimer);
  displayTimer = setInterval(refreshDisplay, 90000);
}

async function refreshDisplay(){
  if(!location.hash.startsWith('#/display')) { if(displayTimer) clearInterval(displayTimer); return; }
  const data = await gs('getPublishAll');
  const peserta = data.peserta;
  const locked = data.locked;

  const board = document.getElementById('boardBody');
  if(locked.length===0){
    board.innerHTML = `<div class="head"><h1>Klasemen Sementara</h1><div class="progress">0 dari ${peserta.length} peserta tampil</div></div>
      <div class="empty-note">Menunggu hasil penilaian peserta pertama...</div>`;
    return;
  }
  const last = locked.slice().sort((a,b)=> b.ts-a.ts)[0];
  const ranked = locked.slice().sort((a,b)=> b.final-a.final);

  board.innerHTML = `
    <div class="head"><h1>Klasemen Sementara</h1><div class="progress">${locked.length} dari ${peserta.length} peserta tampil</div></div>
    <div class="now-card">
      <div class="eyebrow">Tampil Terakhir · No. ${last.no}</div>
      <div class="name">${last.nama}</div>
      <div class="breakdown">
        <div class="item"><div class="k">Tajwid (35%)</div><div class="v">${last.tajwid}</div></div>
        <div class="item"><div class="k">Fashahah &amp; Adab (35%)</div><div class="v">${last.fashahah}</div></div>
        <div class="item"><div class="k">Lagu &amp; Suara (30%)</div><div class="v">${last.lagu}</div></div>
        <div class="item final"><div class="k">Nilai Akhir</div><div class="v">${last.final}</div></div>
      </div>
    </div>
    <div class="klasemen">
      <h2>Peringkat Sementara</h2>
      ${ranked.map((r,i)=>`<div class="rank-row"><div class="pos">${i+1}</div><div class="nm">${r.nama} <span style="color:#8FA396;font-size:13px">No. ${r.no}</span></div><div class="sc">${r.final}</div></div>`).join('')}
    </div>`;
}
</script>
</body>
</html>
